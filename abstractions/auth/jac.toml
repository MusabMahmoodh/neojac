# The `auth` abstraction: who a caller is, and how one signs in. Source says
# `:prot`, the caller's `root`, and a page's `sign_in()`.
[project]
name = "auth"
kind = "abstraction"

# `interface` is the class a plugin of it implements, and `interface_ver` that
# interface's version: a number that goes up when the interface changes so
# that a plugin written for it would not survive. A plugin says the one it was
# written for. `settings` is the class of the abstraction's own settings,
# which every plugin's class derives from beside the interface, and which a
# project gives under [auth]. `per` is what has one plugin of it (a project,
# or each of its spaces), `picked` when that plugin is chosen (as a program
# starts, or as a space is built), and `standard` the plugin a project has
# until it names another: it is in this directory.
[abstraction]
interface = "auth.contract.Auth"
settings = "auth.contract.AuthSettings"
interface_ver = 4
per = "project"
picked = "start"
standard = "accounts"
