# The standard `auth` plugin: accounts of a username and a password,
# and their sessions, in a SQLite file.
[project]
name = "accounts"
kind = "plugin"

[plugin]
fills = "auth"
interface_ver = 2
class = "accounts.auth.Accounts"

# What the accounts are, over the file that keeps them; and what opens that
# file at a layout, and upgrades an older one.
[packages]
accountbook = { path = "../../../libraries/accountbook" }
sqlfile = { path = "../../../libraries/sqlfile" }

[check.lint]
select = []
