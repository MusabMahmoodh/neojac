# stdjac: what a program's source says of the language's abstractions (`root`,
# `by llm()`, `:prot`, `@job`), and what connects that to the plugin a
# project binds for each. The abstractions, the contract a plugin of each
# implements and the plugins neojac ships are the public repository's, in
# `abstractions/`: this imports the contracts, and nothing of a plugin.
[project]
name = "stdjac"
kind = "library"

[check]
# jsx is what a JS space's program says of JSX. neojac loads it into one, and
# it is no program of its own: an app's check is its check.
exclude = ["jsx.jac"]
